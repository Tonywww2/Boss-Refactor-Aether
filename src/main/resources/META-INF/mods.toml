modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="aether"
    mandatory=true
    # The Aether reports its version as "1.20.1-1.5.2-neoforge"; a "[1.20.1,)" bound would
    # sort below it because of the qualifier, so keep the lower bound at 1.20.
    versionRange="[1.20,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=false
    versionRange="[15,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="slashblade_sendims"
    mandatory=false
    versionRange="[1.0.19,)"
    ordering="AFTER"
    side="BOTH"

[[mixins]]
    config="bossrefactoraether.mixins.json"
