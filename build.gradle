plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    // accessTransformer = file("src/main/resources/META-INF/accesstransformer.cfg")

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // Remap the SRG names in every mod's mixin refmap to the dev mappings.
            // Without this, dependency mods that use Mixin (e.g. The Aether) fail to apply.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "bossrefactoraether.refmap.json"
    config "bossrefactoraether.mixins.json"
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()

    flatDir {
        name = 'Local mods'
        dirs 'libs'
    }

    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }

    maven {
        // JEI
        name = "Jared's maven"
        url = 'https://maven.blamejared.com/'
    }

    maven {
        // JEI fallback mirror
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }

    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }

    maven {
        // Curios
        name = 'Illusive Soulworks maven'
        url = 'https://maven.theillusivec4.top/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // The Aether - compile + runtime dependency
    implementation fg.deobf("curse.maven:aether-255308:${aether_file_id}")

    // Aether JiJ API needed to compile against Slider's BossMob/BossRoomTracker types.
    compileOnly fg.deobf('local:nitrogen_internals:1.20.1-1.0.12-neoforge')

    // Optional Leader API integration. Replace this local 1.0.19 coordinate with the next CurseMaven file ID after publishing.
    compileOnly fg.deobf('local:slashblade_sendims:1.0.19')
    if (project.hasProperty('enableSenDimsRuntime')) {
        runtimeOnly fg.deobf('local:slashblade_sendims:1.0.19')
    }

    // Curios - The Aether declares it as a mandatory dependency, so it must be present at runtime
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")

    // JEI - runtime-only (dev recipe viewer). Swap to compileOnly api artifacts if a @JeiPlugin is added.
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    implementation 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version    : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version        : forge_version,
            forge_version_range  : forge_version_range,
            loader_version_range : loader_version_range,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_license          : mod_license,
            mod_version          : mod_version,
            mod_authors          : mod_authors,
            mod_description      : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def runTests = providers.gradleProperty('runTests')
        .map { value -> value.toString().trim().isEmpty() || value.toString().toBoolean() }
        .getOrElse(false)

tasks.register('sliderMechanicsTest', JavaExec) {
    group = 'verification'
    description = 'Runs dependency-free Slider balance checks when -PrunTests is present.'
    enabled = runTests
    if (runTests) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'com.tonywww.bossrefactoraether.slider.SliderMechanicsSelfTest'
    }
}

tasks.register('valkyrieQueenMechanicsTest', JavaExec) {
    group = 'verification'
    description = 'Runs Valkyrie Queen combat geometry checks when -PrunTests is present.'
    enabled = runTests
    if (runTests) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'com.tonywww.bossrefactoraether.valkyriequeen.ValkyrieQueenMechanicsSelfTest'
    }
}

tasks.register('sunSpiritMechanicsTest', JavaExec) {
    group = 'verification'
    description = 'Runs Sun Spirit combat geometry checks when -PrunTests is present.'
    enabled = runTests
    if (runTests) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'com.tonywww.bossrefactoraether.sunspirit.SunSpiritMechanicsSelfTest'
    }
}

tasks.register('verifyOptionalSenDimsIsolation') {
    group = 'verification'
    description = 'Checks SenDimS API isolation when -PrunTests is present.'
    enabled = runTests
    def coreSources = fileTree('src/main/java') {
        include '**/*.java'
        exclude '**/compat/sendims/**'
    }
    inputs.files(coreSources)
    doLast {
        def leaks = coreSources.files.findAll {
            it.getText('UTF-8').contains('com.tonywww.slashblade_sendims')
        }
        if (!leaks.isEmpty()) {
            throw new GradleException("SenDimS API leaked into core classes: ${leaks}")
        }
    }
}

tasks.register('verifySenDimsParryEffects') {
    group = 'verification'
    description = 'Checks SenDimS PARRIED effect paths when -PrunTests is present.'
    enabled = runTests
    def compatFile = file(
            'src/main/java/com/tonywww/bossrefactoraether/compat/sendims/SenDimsSliderCompat.java')
    def clientProviderFile = file(
            'src/main/java/com/tonywww/bossrefactoraether/compat/sendims/client/ExternalLeaderIndicatorProvider.java')
    def combatFiles = [
            file('src/main/java/com/tonywww/bossrefactoraether/slider/SliderCombatService.java'),
            file('src/main/java/com/tonywww/bossrefactoraether/valkyriequeen/ValkyrieQueenCombatService.java'),
            file('src/main/java/com/tonywww/bossrefactoraether/sunspirit/SunSpiritCombatService.java')
    ]
    inputs.files([compatFile, clientProviderFile] + combatFiles)
    doLast {
        def compat = compatFile.getText('UTF-8')
        def requiredCompatContracts = [
                'AetherEntityTypes.SLIDER.get()',
                'AetherEntityTypes.VALKYRIE_QUEEN.get()',
                'AetherEntityTypes.SUN_SPIRIT.get()',
                'SliderParryIntegration.install(compat)',
                'ValkyrieQueenParryIntegration.install(compat)',
                'SunSpiritParryIntegration.install(compat)',
                '@SubscribeEvent(priority = EventPriority.LOWEST)',
                'event.setDecision(LeaderParryDecision.PARRY)',
                'registerClientIndicatorProvider()',
                'SunSpiritCombatService.acceptParry(sunSpirit)',
                '.SUN_SPIRIT_TIMING.parryRecoveryTicks.get()',
                'ValkyrieQueenCombatService.acceptParry(queen)',
                '.VALKYRIE_QUEEN_TIMING.parryRecoveryTicks.get()',
                'SliderCombatService.acceptParryWithoutBarrier(slider)',
                'SliderCombatService.consumeBarrierFromParryAttempt(',
                '.SLIDER_COMBAT.parryRecoveryTicks.get()',
                'Math.max(parryRecoveryTicks,'
        ]
        def missing = requiredCompatContracts.findAll { !compat.contains(it) }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    "SenDimS parry-effect contracts are missing: ${missing}")
        }
        if (compat.contains('LeaderParryDecision.ABSORB')) {
            throw new GradleException(
                    'Parry-break attacks must use SenDimS PARRY, not ABSORB')
        }
                if (compat.contains('sendParticles(')
                    || compat.contains('DustParticleOptions')) {
                    throw new GradleException(
                        'Server-side warning particles would leave stale colors after cast')
                }
        def completeParryCalls = (compat =~ /completeParry\(event,/).count
        if (completeParryCalls != 4) {
            throw new GradleException(
                "Expected four SenDimS completeParry paths, got ${completeParryCalls}")
        }
        def sliderService = combatFiles[0].getText('UTF-8')
        def zeroBarrierStart = sliderService.indexOf(
            'public static void acceptParryWithoutBarrier')
        def zeroBarrierEnd = sliderService.indexOf(
            'public static float barrierDamageMultiplier', zeroBarrierStart)
        def zeroBarrierBody = zeroBarrierStart >= 0 && zeroBarrierEnd > zeroBarrierStart
            ? sliderService.substring(zeroBarrierStart, zeroBarrierEnd)
            : ''
        if (!zeroBarrierBody.contains(
            'SLIDER_COMBAT.parryRecoveryTicks.get()')) {
            throw new GradleException(
            'Zero-barrier Slider parries must enter local parry recovery')
        }
        def unsynchronized = combatFiles.findAll {
            !it.getText('UTF-8').contains('synchronizeParryWindow(')
        }
        if (!unsynchronized.isEmpty()) {
            throw new GradleException(
                    "Parry-window synchronization is missing: ${unsynchronized}")
        }
        def clientProvider = clientProviderFile.getText('UTF-8')
        def requiredClientContracts = [
            'ClientLeaderIndicatorApi.registerExternalWarningProvider(',
            'ExternalLeaderIndicatorProvider::warningProgress',
                'ParryIndicatorStyle.isVisible(true, telegraph)',
            'OptionalDouble.of(telegraph.progress())',
                'entity instanceof Slider',
                'entity instanceof ValkyrieQueen',
                'entity instanceof SunSpirit'
        ]
        def missingClientContracts = requiredClientContracts.findAll {
            !clientProvider.contains(it)
        }
        if (!missingClientContracts.isEmpty()) {
            throw new GradleException(
                "SenDimS indicator-provider contracts are missing: ${missingClientContracts}")
        }
        def migratedRenderingContracts = [
            'RenderLivingEvent',
            'ClientTickEvent',
            'DustParticleOptions',
            'Component.literal("危")',
            'particleEngine'
        ]
        def retainedRenderingContracts = migratedRenderingContracts.findAll {
            clientProvider.contains(it)
        }
        if (!retainedRenderingContracts.isEmpty()) {
            throw new GradleException(
                "Rendering must be owned by SenDimS: ${retainedRenderingContracts}")
        }
    }
}

tasks.named('test').configure {
    enabled = runTests
    if (!runTests) {
        setDependsOn([])
    }
}

tasks.named('compileTestJava').configure {
    enabled = runTests
}

tasks.named('processTestResources').configure {
    enabled = runTests
}

tasks.named('testClasses').configure {
    enabled = runTests
}

tasks.named('check').configure {
    setDependsOn([])
    if (runTests) {
        dependsOn tasks.named('test')
        dependsOn tasks.named('sliderMechanicsTest')
        dependsOn tasks.named('valkyrieQueenMechanicsTest')
        dependsOn tasks.named('sunSpiritMechanicsTest')
        dependsOn tasks.named('verifyOptionalSenDimsIsolation')
        dependsOn tasks.named('verifySenDimsParryEffects')
    }
}
