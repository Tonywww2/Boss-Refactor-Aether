plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    // accessTransformer = file("src/main/resources/META-INF/accesstransformer.cfg")

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // Remap the SRG names in every mod's mixin refmap to the dev mappings.
            // Without this, dependency mods that use Mixin (e.g. The Aether) fail to apply.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "bossrefactoraether.refmap.json"
    config "bossrefactoraether.mixins.json"
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()

    flatDir {
        name = 'Local mods'
        dirs 'libs'
    }

    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }

    maven {
        // JEI
        name = "Jared's maven"
        url = 'https://maven.blamejared.com/'
    }

    maven {
        // JEI fallback mirror
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }

    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }

    maven {
        // Curios
        name = 'Illusive Soulworks maven'
        url = 'https://maven.theillusivec4.top/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // The Aether - compile + runtime dependency
    implementation fg.deobf("curse.maven:aether-255308:${aether_file_id}")

    // Aether JiJ API needed to compile against Slider's BossMob/BossRoomTracker types.
    compileOnly fg.deobf('local:nitrogen_internals:1.20.1-1.0.12-neoforge')

    // Optional Leader API integration. Replace this local 1.0.19 coordinate with the next CurseMaven file ID after publishing.
    compileOnly fg.deobf('local:slashblade_sendims:1.0.19')
    if (project.hasProperty('enableSenDimsRuntime')) {
        runtimeOnly fg.deobf('local:slashblade_sendims:1.0.19')
    }

    // Curios - The Aether declares it as a mandatory dependency, so it must be present at runtime
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")

    // JEI - runtime-only (dev recipe viewer). Swap to compileOnly api artifacts if a @JeiPlugin is added.
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    implementation 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version    : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version        : forge_version,
            forge_version_range  : forge_version_range,
            loader_version_range : loader_version_range,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_license          : mod_license,
            mod_version          : mod_version,
            mod_authors          : mod_authors,
            mod_description      : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('sliderMechanicsTest', JavaExec) {
    group = 'verification'
    description = 'Runs dependency-free Slider balance checks.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.tonywww.bossrefactoraether.slider.SliderMechanicsSelfTest'
}

tasks.register('valkyrieQueenMechanicsTest', JavaExec) {
    group = 'verification'
    description = 'Runs dependency-free Valkyrie Queen combat geometry checks.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.tonywww.bossrefactoraether.valkyriequeen.ValkyrieQueenMechanicsSelfTest'
}

tasks.register('verifyOptionalSenDimsIsolation') {
    group = 'verification'
    description = 'Ensures only the delayed SenDimS compat package links against its API.'
    def coreSources = fileTree('src/main/java') {
        include '**/*.java'
        exclude '**/compat/sendims/**'
    }
    inputs.files(coreSources)
    doLast {
        def leaks = coreSources.files.findAll {
            it.getText('UTF-8').contains('com.tonywww.slashblade_sendims')
        }
        if (!leaks.isEmpty()) {
            throw new GradleException("SenDimS API leaked into core classes: ${leaks}")
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('sliderMechanicsTest')
    dependsOn tasks.named('valkyrieQueenMechanicsTest')
    dependsOn tasks.named('verifyOptionalSenDimsIsolation')
}
